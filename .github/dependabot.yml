version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        patterns: ['*']
    ignore:
      # typescript-eslint supports TypeScript < 6.1; a major bump breaks the whole group.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Keep Node typings on the Node major the project runs on (see .nvmrc).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
