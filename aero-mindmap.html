<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aero Bubbles — Mind Map</title>
<style>
  :root{
    --aero-blue-deep:#0a3b6e;
    --aero-blue:#1d6fbf;
    --aero-cyan:#5db2e8;
    --aero-glass:rgba(180,220,250,.28);
    --glass-border:rgba(255,255,255,.65);
    --text-dark:#0b3a63;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{
    font-family:"Segoe UI","Segoe UI Variable",Tahoma,Frutiger,sans-serif;
    background:
      radial-gradient(ellipse 120% 80% at 70% -10%, rgba(173,228,255,.85), transparent 60%),
      radial-gradient(ellipse 90% 70% at 15% 110%, rgba(38,142,96,.55), transparent 62%),
      radial-gradient(ellipse 70% 60% at 95% 95%, rgba(20,90,170,.7), transparent 65%),
      linear-gradient(160deg,#7ec8f0 0%, #2f86cf 38%, #1259a0 70%, #0a3b6e 100%);
    color:var(--text-dark);
    user-select:none; -webkit-user-select:none;
    touch-action:none;
  }

  /* ====== Win7 wallpaper light streaks ====== */
  .streaks{position:fixed; inset:0; pointer-events:none; overflow:hidden;}
  .streaks span{
    position:absolute; display:block; border-radius:50%;
    background:linear-gradient(90deg,transparent, rgba(255,255,255,.35), transparent);
    filter:blur(2px); opacity:.5;
    transform:rotate(-24deg);
  }
  .streaks span:nth-child(1){width:140vw;height:5px;top:24%;left:-20vw;}
  .streaks span:nth-child(2){width:140vw;height:2px;top:31%;left:-10vw;opacity:.35;}
  .streaks span:nth-child(3){width:140vw;height:8px;top:58%;left:-15vw;opacity:.25;}
  .streaks span:nth-child(4){width:140vw;height:3px;top:73%;left:-25vw;opacity:.3;}
  .orb{position:fixed; border-radius:50%; pointer-events:none; filter:blur(30px); opacity:.4;}
  .orb.a{width:34vmin;height:34vmin;background:radial-gradient(circle at 35% 30%, #bfffe9, #2fbf8f 60%, transparent 75%); left:-8vmin; bottom:-8vmin;}
  .orb.b{width:26vmin;height:26vmin;background:radial-gradient(circle at 35% 30%, #d8f3ff, #57aef0 60%, transparent 75%); right:-6vmin; top:10vmin;}

  /* ====== Aero glass toolbar ====== */
  .toolbar{
    position:fixed; top:10px; left:50%; transform:translateX(-50%);
    z-index:50; display:flex; align-items:center; gap:8px;
    padding:7px 12px; border-radius:9px;
    background:linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(220,240,255,.25) 48%, rgba(160,205,240,.18) 52%, rgba(200,230,255,.35) 100%);
    backdrop-filter:blur(14px) saturate(1.5);
    -webkit-backdrop-filter:blur(14px) saturate(1.5);
    border:1px solid var(--glass-border);
    box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 8px 24px rgba(8,40,80,.35), 0 0 0 1px rgba(20,80,140,.25);
    max-width:calc(100vw - 16px);
  }
  .toolbar .title{
    font-size:13px; font-weight:600; letter-spacing:.2px;
    color:#fff; text-shadow:0 0 8px rgba(140,210,255,.9), 0 1px 2px rgba(10,50,90,.6);
    padding:0 6px; white-space:nowrap;
  }
  .btn{
    appearance:none; cursor:pointer; font-family:inherit;
    font-size:12.5px; color:var(--text-dark);
    padding:5px 13px; border-radius:4px;
    border:1px solid #5c8db8;
    background:linear-gradient(180deg,#f6fbff 0%,#e6f2fb 45%,#cfe5f6 50%,#e8f4fd 100%);
    box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(10,50,90,.25);
    white-space:nowrap;
    transition:filter .12s;
  }
  .btn:hover{filter:brightness(1.06);
    border-color:#3e7bb0;
    box-shadow:0 1px 0 rgba(255,255,255,.95) inset, 0 0 8px rgba(120,200,255,.8);}
  .btn:active{background:linear-gradient(180deg,#cfe5f6,#e6f2fb); box-shadow:0 1px 3px rgba(10,50,90,.35) inset;}
  .btn.toggled{
    background:linear-gradient(180deg,#bfe1ff 0%,#8ec6f5 45%,#5aa6e8 50%,#9fd2f9 100%);
    color:#062c52; border-color:#2d6da8;
    box-shadow:0 1px 2px rgba(10,50,90,.4) inset, 0 0 10px rgba(120,200,255,.9);
  }

  /* ====== hint ====== */
  .hint{
    position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    z-index:40; font-size:12px; color:#eaf6ff; text-align:center;
    text-shadow:0 1px 3px rgba(5,35,70,.8);
    background:rgba(10,55,100,.35); border:1px solid rgba(255,255,255,.35);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-radius:8px; padding:6px 14px; max-width:92vw;
    pointer-events:none; transition:opacity .5s;
  }

  /* ====== canvas layers ====== */
  #world{position:fixed; inset:0;}
  #wires{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
  #wires path.link{
    fill:none; stroke-width:3; stroke-linecap:round;
    stroke:url(#wireGrad);
    filter:drop-shadow(0 2px 3px rgba(8,40,80,.4));
  }
  #wires path.link-glow{
    fill:none; stroke:rgba(255,255,255,.55); stroke-width:1; stroke-linecap:round;
  }
  #wires path.temp{
    fill:none; stroke:rgba(255,255,255,.85); stroke-width:2.5; stroke-dasharray:6 7; stroke-linecap:round;
  }

  /* ====== THE BUBBLE ====== */
  .bubble{
    position:absolute; transform:translate(-50%,-50%);
    width:var(--d); height:var(--d); border-radius:50%;
    cursor:grab; touch-action:none;
    animation:floatIn .45s cubic-bezier(.2,1.4,.4,1) both;
  }
  .bubble:active{cursor:grabbing;}
  @keyframes floatIn{ 0%{transform:translate(-50%,-50%) scale(.2); opacity:0;} 100%{transform:translate(-50%,-50%) scale(1); opacity:1;} }

  /* floating-in-air drift: each bubble bobs + sways on its own rhythm */
  .floaty{
    position:absolute; inset:0;
    animation:bob var(--bobdur,5s) ease-in-out var(--bobdel,0s) infinite alternate,
              sway calc(var(--bobdur,5s)*1.7) ease-in-out var(--bobdel,0s) infinite alternate;
    will-change:transform;
  }
  @keyframes bob{
    0%{transform:translateY(-7px) rotate(-1.2deg);}
    100%{transform:translateY(7px) rotate(1.2deg);}
  }
  @keyframes sway{
    0%{margin-left:-5px;}
    100%{margin-left:5px;}
  }
  .bubble.dragging .floaty{animation-play-state:paused;}
  .bubble.dragging .skin{filter:brightness(1.07);}
  @media (prefers-reduced-motion:reduce){ .floaty, .bubble.wobble .skin{animation:none;} }

  .bubble .skin{
    position:absolute; inset:0; border-radius:50%;
    background:
      /* big soft specular top-left */
      radial-gradient(circle at 30% 24%, rgba(255,255,255,.95) 0%, rgba(255,255,255,.5) 7%, rgba(255,255,255,0) 22%),
      /* small hot spot */
      radial-gradient(circle at 38% 18%, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 6%),
      /* lower-right secondary reflection */
      radial-gradient(circle at 74% 82%, rgba(255,255,255,.5) 0%, rgba(210,245,255,.18) 9%, rgba(255,255,255,0) 24%),
      /* iridescent rim — soap film colors */
      radial-gradient(circle at 50% 50%,
        rgba(255,255,255,0) 58%,
        rgba(173,255,235,.16) 70%,
        rgba(255,190,240,.20) 79%,
        rgba(150,210,255,.34) 87%,
        rgba(255,255,255,.55) 96%,
        rgba(255,255,255,.18) 100%),
      /* glass body tint */
      radial-gradient(circle at 50% 56%, rgba(190,228,255,.10) 0%, rgba(140,200,245,.16) 60%, rgba(90,160,220,.26) 100%);
    box-shadow:
      0 1px 1px rgba(255,255,255,.7) inset,
      0 -8px 18px rgba(40,110,180,.25) inset,
      0 10px 22px rgba(6,38,76,.35),
      0 2px 6px rgba(6,38,76,.25);
    border:1px solid rgba(255,255,255,.5);
    transition:box-shadow .2s, filter .2s;
  }
  .bubble .gloss{ /* crisp aero top gloss — the Win7 "half shine" */
    position:absolute; left:9%; top:4%; width:82%; height:46%;
    border-radius:50% / 58%;
    background:linear-gradient(180deg, rgba(255,255,255,.85) 0%, rgba(255,255,255,.32) 55%, rgba(255,255,255,0) 100%);
    opacity:.75; pointer-events:none;
    mix-blend-mode:screen;
  }
  .bubble.wobble .skin{animation:wob 3.6s ease-in-out infinite;}
  @keyframes wob{
    0%,100%{border-radius:50%;}
    25%{border-radius:51% 49% 50% 50% / 50% 51% 49% 50%;}
    50%{border-radius:49% 51% 51% 49% / 51% 49% 50% 51%;}
    75%{border-radius:50% 50% 49% 51% / 49% 50% 51% 50%;}
  }
  .bubble .label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:18%;
    font-size:var(--fs,14px); font-weight:600; line-height:1.2;
    color:#fff;
    text-shadow:0 1px 3px rgba(8,45,90,.85), 0 0 10px rgba(120,200,255,.6);
    outline:none; word-break:break-word; overflow:hidden;
    pointer-events:none; cursor:text; user-select:none; -webkit-user-select:none;
  }
  .bubble.editing .label{pointer-events:auto; user-select:text; -webkit-user-select:text;}
  .bubble .label:empty::before{content:"idea…"; opacity:.55; font-weight:400; font-style:italic;}

  .bubble.selected .skin{
    box-shadow:
      0 1px 1px rgba(255,255,255,.7) inset,
      0 -8px 18px rgba(40,110,180,.25) inset,
      0 10px 26px rgba(6,38,76,.4),
      0 0 0 2px rgba(255,255,255,.85),
      0 0 18px 4px rgba(130,215,255,.95);
  }
  .bubble.linkme .skin{
    box-shadow:0 0 0 3px rgba(255,255,160,.9), 0 0 22px 6px rgba(255,240,130,.8), 0 10px 22px rgba(6,38,76,.35);
  }

  /* node action chips */
  .chip{
    position:absolute; z-index:5;
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; cursor:pointer;
    border:1px solid rgba(255,255,255,.8);
    box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 2px 6px rgba(6,38,76,.4);
    opacity:0; transform:scale(.5); transition:opacity .15s, transform .15s;
    pointer-events:none;
  }
  .bubble.selected .chip{opacity:1; transform:scale(1); pointer-events:auto;}
  .chip.link{ right:-8px; top:-4px;
    background:linear-gradient(180deg,#fdfff0,#ffe98a 50%,#f7c948);
    color:#5c4500;
  }
  .chip.pop{ left:-8px; top:-4px;
    background:linear-gradient(180deg,#fff3f3,#ffb3b3 50%,#f07575);
    color:#6b0d0d;
  }
  .chip.grow{ right:-8px; bottom:-4px;
    background:linear-gradient(180deg,#f0fbff,#a8dcff 50%,#5fb4ef);
    color:#0b3a63; font-size:15px;
  }

  /* pop animation */
  .bubble.popping{pointer-events:none; animation:pop .28s ease-out forwards;}
  @keyframes pop{
    0%{transform:translate(-50%,-50%) scale(1); opacity:1;}
    55%{transform:translate(-50%,-50%) scale(1.25); opacity:.9;}
    100%{transform:translate(-50%,-50%) scale(1.5); opacity:0;}
  }
  .droplet{
    position:absolute; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff, #9fd4f7 70%);
    pointer-events:none; animation:fly .5s ease-out forwards;
  }
  @keyframes fly{
    0%{opacity:1; transform:translate(0,0) scale(1);}
    100%{opacity:0; transform:translate(var(--dx),var(--dy)) scale(.3);}
  }
</style>
</head>
<body>

<div class="streaks"><span></span><span></span><span></span><span></span></div>
<div class="orb a"></div><div class="orb b"></div>

<div id="world">
  <svg id="wires">
    <defs>
      <linearGradient id="wireGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="rgba(255,255,255,.9)"/>
        <stop offset=".5" stop-color="rgba(150,220,255,.85)"/>
        <stop offset="1" stop-color="rgba(255,255,255,.9)"/>
      </linearGradient>
    </defs>
  </svg>
</div>

<div class="toolbar">
  <span class="title">Aero Bubbles</span>
  <button class="btn" id="btnNew">＋ New bubble</button>
  <button class="btn" id="btnConnect">🔗 Connect</button>
  <button class="btn" id="btnClear">Clear</button>
</div>

<div class="hint" id="hint">Double-tap the canvas to blow a bubble · tap a bubble to select · drag to move</div>

<script>
(function(){
  const world = document.getElementById('world');
  const wires = document.getElementById('wires');
  const hint  = document.getElementById('hint');
  const btnConnect = document.getElementById('btnConnect');

  let nodes = [];      // {id, x, y, d, el, label}
  let links = [];      // {a, b, glow, core}
  let selected = null;
  let connectMode = false;
  let linkSource = null;
  let uid = 0;

  const setHint = (t)=>{ hint.textContent = t; hint.style.opacity = 1; };

  /* ---------- bubble factory ---------- */
  function createBubble(x, y, text){
    const id = ++uid;
    const d = 130;
    const el = document.createElement('div');
    el.className = 'bubble wobble';
    el.style.setProperty('--d', d+'px');
    el.style.left = x+'px'; el.style.top = y+'px';
    el.innerHTML = `
      <div class="floaty">
        <div class="skin"></div>
        <div class="gloss"></div>
        <div class="label" contenteditable="true" spellcheck="false"></div>
        <div class="chip pop"  title="Pop bubble">✕</div>
        <div class="chip link" title="Connect from here">🔗</div>
        <div class="chip grow" title="Resize">⤢</div>
      </div>`;
    el.style.setProperty('--bobdur', (4 + Math.random()*3).toFixed(2)+'s');
    el.style.setProperty('--bobdel', (-Math.random()*5).toFixed(2)+'s');
    world.appendChild(el);

    const node = {id, x, y, d, el, label:el.querySelector('.label')};
    if(text) node.label.textContent = text;
    nodes.push(node);

    attachDrag(node);
    attachChips(node);

    node.label.addEventListener('input', ()=> fitText(node));
    node.label.addEventListener('blur', ()=> el.classList.remove('editing'));
    return node;
  }

  function fitText(node){
    const len = node.label.textContent.length;
    const fs = Math.max(10, Math.min(16, Math.round(node.d/7 - len*0.18)));
    node.label.style.setProperty('--fs', fs+'px');
    node.label.style.fontSize = fs+'px';
  }

  function select(node){
    if(selected && selected !== node){
      selected.el.classList.remove('selected','editing');
    }
    selected = node;
    if(node) node.el.classList.add('selected');
  }
  function deselect(){
    if(selected){
      selected.el.classList.remove('selected','editing');
      selected.label.blur();
    }
    selected = null;
  }

  /* ---------- drag ---------- */
  function attachDrag(node){
    let startX, startY, ox, oy, moved=false, pid=null;
    node.el.addEventListener('pointerdown', (e)=>{
      if(e.target.classList.contains('chip')) return;
      pid = e.pointerId;
      node.el.setPointerCapture(pid);
      startX=e.clientX; startY=e.clientY; ox=node.x; oy=node.y; moved=false;
      e.preventDefault();
    });
    node.el.addEventListener('pointermove',(e)=>{
      if(pid===null || e.pointerId!==pid) return;
      const dx=e.clientX-startX, dy=e.clientY-startY;
      if(Math.abs(dx)+Math.abs(dy)>4){ moved=true; node.el.classList.add('dragging'); }
      if(moved){
        node.x=ox+dx; node.y=oy+dy;
        node.el.style.left=node.x+'px'; node.el.style.top=node.y+'px';
        redrawLinks();
      }
    });
    node.el.addEventListener('pointerup',(e)=>{
      if(pid===null || e.pointerId!==pid) return;
      pid=null;
      node.el.classList.remove('dragging');
      if(!moved) handleTap(node);
    });
    node.el.addEventListener('pointercancel', ()=>{ pid=null; node.el.classList.remove('dragging'); });
  }

  function handleTap(node){
    if(connectMode){
      if(!linkSource){
        linkSource = node;
        node.el.classList.add('linkme');
        setHint('Now tap the bubble you want to connect it to');
      }else if(linkSource !== node){
        addLink(linkSource, node);
        linkSource.el.classList.remove('linkme');
        linkSource = null;
        setHint('Connected! Tap two more bubbles, or toggle 🔗 Connect off');
      }
    }else{
      select(node);
      node.el.classList.add('editing');
      node.label.focus();
    }
  }

  /* ---------- chips ---------- */
  function attachChips(node){
    node.el.querySelector('.chip.pop').addEventListener('pointerdown', (e)=>{
      e.stopPropagation(); popBubble(node);
    });
    node.el.querySelector('.chip.link').addEventListener('pointerdown', (e)=>{
      e.stopPropagation();
      connectMode || toggleConnect(true);
      linkSource && linkSource.el.classList.remove('linkme');
      linkSource = node;
      node.el.classList.add('linkme');
      setHint('Now tap the bubble you want to connect it to');
    });
    /* resize */
    const grow = node.el.querySelector('.chip.grow');
    let gp=null, gd0=0, gx0=0, gy0=0;
    grow.addEventListener('pointerdown',(e)=>{
      e.stopPropagation(); gp=e.pointerId; grow.setPointerCapture(gp);
      gd0=node.d; gx0=e.clientX; gy0=e.clientY;
    });
    grow.addEventListener('pointermove',(e)=>{
      if(gp===null||e.pointerId!==gp) return;
      const delta = (e.clientX-gx0 + e.clientY-gy0)/2;
      node.d = Math.max(80, Math.min(280, gd0 + delta*1.4));
      node.el.style.setProperty('--d', node.d+'px');
      fitText(node); redrawLinks();
    });
    grow.addEventListener('pointerup',()=> gp=null);
  }

  /* ---------- pop ---------- */
  function popBubble(node){
    links = links.filter(l=>{
      if(l.a===node || l.b===node){ l.core.remove(); l.glow.remove(); return false; }
      return true;
    });
    nodes = nodes.filter(n=> n!==node);
    if(selected===node) selected=null;
    if(linkSource===node) linkSource=null;
    /* droplets */
    for(let i=0;i<10;i++){
      const drop=document.createElement('div');
      drop.className='droplet';
      drop.style.left=node.x+'px'; drop.style.top=node.y+'px';
      const ang=Math.random()*Math.PI*2, r=node.d*0.6+Math.random()*40;
      drop.style.setProperty('--dx', Math.cos(ang)*r+'px');
      drop.style.setProperty('--dy', Math.sin(ang)*r+'px');
      world.appendChild(drop);
      setTimeout(()=>drop.remove(), 520);
    }
    node.el.classList.add('popping');
    setTimeout(()=> node.el.remove(), 300);
  }

  /* ---------- links ---------- */
  function addLink(a,b){
    if(links.some(l=> (l.a===a&&l.b===b)||(l.a===b&&l.b===a))) return;
    const core=document.createElementNS('http://www.w3.org/2000/svg','path');
    core.setAttribute('class','link');
    const glow=document.createElementNS('http://www.w3.org/2000/svg','path');
    glow.setAttribute('class','link-glow');
    wires.appendChild(core); wires.appendChild(glow);
    links.push({a,b,core,glow});
    redrawLinks();
  }
  function redrawLinks(){
    for(const l of links){
      const mx=(l.a.x+l.b.x)/2, my=(l.a.y+l.b.y)/2 - 18;
      const dPath=`M ${l.a.x} ${l.a.y} Q ${mx} ${my} ${l.b.x} ${l.b.y}`;
      l.core.setAttribute('d', dPath);
      l.glow.setAttribute('d', dPath);
    }
  }

  /* ---------- connect mode ---------- */
  function toggleConnect(force){
    connectMode = force!==undefined ? force : !connectMode;
    btnConnect.classList.toggle('toggled', connectMode);
    if(connectMode){
      deselect();
      setHint('Connect mode: tap the first bubble');
    }else{
      if(linkSource){ linkSource.el.classList.remove('linkme'); linkSource=null; }
      setHint('Double-tap the canvas to blow a bubble');
    }
  }
  btnConnect.addEventListener('click', ()=> toggleConnect());

  /* ---------- toolbar ---------- */
  document.getElementById('btnNew').addEventListener('click', ()=>{
    const n=createBubble(innerWidth/2+(Math.random()*120-60), innerHeight/2+(Math.random()*120-60));
    select(n); setTimeout(()=> n.label.focus(), 80);
  });
  document.getElementById('btnClear').addEventListener('click', ()=>{
    [...nodes].forEach(popBubble);
  });

  /* ---------- canvas double-tap ---------- */
  let lastTap=0, lastX=0, lastY=0;
  world.addEventListener('pointerdown',(e)=>{
    if(e.target!==world && e.target!==wires) return;
    deselect();
    const now=Date.now();
    if(now-lastTap<350 && Math.abs(e.clientX-lastX)<40 && Math.abs(e.clientY-lastY)<40){
      const n=createBubble(e.clientX,e.clientY);
      select(n); setTimeout(()=> n.label.focus(), 80);
      lastTap=0;
    }else{ lastTap=now; lastX=e.clientX; lastY=e.clientY; }
  });
  world.addEventListener('dblclick',(e)=>{
    if(e.target!==world && e.target!==wires) return;
  });

  /* keyboard delete */
  addEventListener('keydown',(e)=>{
    if((e.key==='Delete') && selected && document.activeElement!==selected.label){
      popBubble(selected);
    }
  });

  /* ---------- starter demo ---------- */
  const cx=innerWidth/2, cy=innerHeight/2;
  const a=createBubble(cx, cy-20, 'Big idea ✨');
  const b=createBubble(cx-Math.min(190,cx*0.6), cy+130, 'branch one');
  const c=createBubble(cx+Math.min(190,cx*0.6), cy+130, 'branch two');
  addLink(a,b); addLink(a,c);
  nodes.forEach(fitText);

  addEventListener('resize', redrawLinks);
})();
</script>
</body>
</html>
